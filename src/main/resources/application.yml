#MySQL Connection
spring:
  datasource:
    url: jdbc:mysql://:3306/ecommerce_db
    username: root
    password: Cfg@12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  info:
    env:
      enable: true


info:
  app:
    name: ecomApp
    description: App is to manage product and users, order etc.
    version: 1.0v
